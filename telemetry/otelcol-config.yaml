receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317 # Default gRPC port
      http:
        endpoint: 0.0.0.0:4318 # Default HTTP port
        # cors:
        #   allowed_origins:
        #     - https://sheldonbish.com/*
  hostmetrics:
    collection_interval: 10s # Or your desired interval
    scrapers:
      cpu: {} # Enable CPU metrics
      memory: {} # Enable Memory metrics
      disk: {}
      load: {}
      filesystem: {}
      network: {}
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/prometheusreceiver
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]

processors:
  batch:

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

exporters:
  otlphttp/metrics:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  otlphttp/traces:
    endpoint: http://tempo:3200
    tls:
      insecure: true
  otlphttp/logs:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp/profiles:
    endpoint: http://pyroscope:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    # Optional: configure resource attribute promotion to labels

service:
  telemetry:
    logs:
      level: "debug"
  pipelines:
    metrics:
      receivers: [otlp, hostmetrics, prometheus/collector]
      processors: [batch]
      exporters: [prometheusremotewrite, otlphttp/metrics, debug/metrics]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces, debug/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs, debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp/profiles]