receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317 # Default gRPC port
      http:
        endpoint: 0.0.0.0:4318 # Default HTTP port
  hostmetrics:
    collection_interval: 10s # Or your desired interval
    scrapers:
      cpu: {} # Enable CPU metrics
      memory: {} # Enable Memory metrics
      disk: {}
      load: {}
      filesystem: {}
      network: {}
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/prometheusreceiver
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]
        - job_name: 'nvidia-gpu-metrics'
          scrape_interval: 5s
          static_configs:
            - targets: ['dgcm-exporter:9400']
          metric_relabel_configs:
            # Filter specifically for GPU utilization and workload metrics
            - source_labels: [__name__]
              regex: 'DCGM_FI_DEV_.*'
              # regex: 'DCGM_FI_DEV_GPU_UTIL|DCGM_FI_DEV_MEM_CLOCK|DCGM_FI_DEV_SM_CLOCK|DCGM_FI_DEV_FB_USED|DCGM_FI_DEV_FB_FREE|DCGM_FI_DEV_FB_TOTAL'
              action: keep

processors:
  batch:

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

exporters:
  # otlphttp/metrics:
  #   endpoint: http://prometheus:9090/api/v1/otlp
  #   tls:
  #     insecure: true
  otlp:
    endpoint: http://dgcm-exporter:9400
  otlphttp/traces:
    endpoint: http://tempo:3200
    tls:
      insecure: true
  otlphttp/logs:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp/profiles:
    endpoint: http://pyroscope:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    # Optional: configure resource attribute promotion to labels

service:
  telemetry:
    logs:
      level: "debug"
  pipelines:
    metrics:
      receivers: [otlp, hostmetrics, prometheus/collector]
      processors: [batch]
      exporters: [prometheusremotewrite, debug/metrics, otlp]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces, debug/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs, debug/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp/profiles]